[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-fridgeguard"
version = "0.1.0"
description = "Security monitoring for a fleet of smart refrigerators: simulation, detection, SQLite storage and a Streamlit SOC dashboard."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "kgiannopoulou" }]
dependencies = [
    "pandas>=2.2",
    "streamlit>=1.40",
    "plotly>=5.24",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.8"]

[project.scripts]
fridgeguard = "fridgeguard.__main__:main"

[tool.setuptools.packages.find]
include = ["fridgeguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
