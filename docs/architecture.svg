<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1100" height="700" fill="#ffffff"/>
  <text x="550" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Smart-FridgeGuard — System Architecture (Phase 1)</text>
  <text x="550" y="62" text-anchor="middle" font-size="13" fill="#64748b">Simulation → detection → storage → SOC dashboard → investigation</text>

  <!-- 1. Refrigeration simulation -->
  <rect x="40" y="100" width="280" height="210" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="180" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">1 · Refrigeration simulation</text>
  <rect x="65" y="145" width="230" height="38" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="180" y="169" text-anchor="middle" font-size="13" fill="#1e293b">FRIDGE-001 · Store A dairy</text>
  <rect x="65" y="191" width="230" height="38" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="180" y="215" text-anchor="middle" font-size="13" fill="#1e293b">FRIDGE-002 · Store A freezer</text>
  <rect x="65" y="237" width="230" height="38" rx="8" fill="#ffffff" stroke="#93c5fd"/>
  <text x="180" y="261" text-anchor="middle" font-size="13" fill="#1e293b">FRIDGE-003 · Pharmacy vaccines</text>
  <text x="180" y="297" text-anchor="middle" font-size="11" fill="#475569">device state · setpoint · door · compressor</text>

  <!-- 2. Python event generator -->
  <rect x="410" y="100" width="280" height="210" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="550" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">2 · Python event generator</text>
  <text x="550" y="160" text-anchor="middle" font-size="13" fill="#1e293b">Temperature readings</text>
  <text x="550" y="184" text-anchor="middle" font-size="13" fill="#1e293b">User logins (success / failure)</text>
  <text x="550" y="208" text-anchor="middle" font-size="13" fill="#1e293b">Configuration changes</text>
  <line x1="440" y1="224" x2="660" y2="224" stroke="#bbf7d0"/>
  <text x="550" y="246" text-anchor="middle" font-size="12" fill="#166534">Scenario injector: baseline · brute force</text>
  <text x="550" y="264" text-anchor="middle" font-size="12" fill="#166534">setpoint tamper · sensor spoof · silence</text>
  <text x="550" y="294" text-anchor="middle" font-size="11" fill="#475569">seeded · common event schema (UTC ISO 8601)</text>

  <!-- 3. Detection engine -->
  <rect x="780" y="100" width="280" height="210" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="920" y="128" text-anchor="middle" font-size="15" font-weight="700" fill="#7c2d12">3 · Detection &amp; correlation</text>
  <text x="920" y="160" text-anchor="middle" font-size="13" fill="#1e293b">Validate &amp; normalise events</text>
  <text x="920" y="184" text-anchor="middle" font-size="13" fill="#1e293b">Rules DR-1 … DR-9</text>
  <text x="920" y="208" text-anchor="middle" font-size="13" fill="#1e293b">Sliding windows · correlation</text>
  <text x="920" y="232" text-anchor="middle" font-size="13" fill="#1e293b">Severity · ATT&amp;CK tags · dedup</text>
  <rect x="820" y="250" width="200" height="34" rx="6" fill="#ffffff" stroke="#fdba74" stroke-dasharray="4 3"/>
  <text x="920" y="272" text-anchor="middle" font-size="12" fill="#9a3412">config/detection.yaml</text>

  <!-- 4. SQLite -->
  <rect x="780" y="420" width="280" height="200" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="920" y="448" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">4 · SQLite event storage</text>
  <text x="920" y="480" text-anchor="middle" font-size="13" fill="#1e293b">devices · events (append-only)</text>
  <text x="920" y="504" text-anchor="middle" font-size="13" fill="#1e293b">alerts · alert_events · alert_history</text>
  <text x="920" y="528" text-anchor="middle" font-size="13" fill="#1e293b">incidents · config_history</text>
  <text x="920" y="566" text-anchor="middle" font-size="11" fill="#475569">WAL mode · indexed by time / device / type</text>
  <text x="920" y="584" text-anchor="middle" font-size="11" fill="#475569">triggers block UPDATE / DELETE on events</text>

  <!-- 5. Streamlit -->
  <rect x="410" y="420" width="280" height="200" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="550" y="448" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">5 · Streamlit SOC dashboard</text>
  <text x="550" y="480" text-anchor="middle" font-size="13" fill="#1e293b">Fleet overview &amp; temperatures</text>
  <text x="550" y="504" text-anchor="middle" font-size="13" fill="#1e293b">Login activity · config changes</text>
  <text x="550" y="528" text-anchor="middle" font-size="13" fill="#1e293b">Alert queue by severity</text>
  <text x="550" y="552" text-anchor="middle" font-size="13" fill="#1e293b">Normal vs suspicious filter</text>
  <text x="550" y="590" text-anchor="middle" font-size="11" fill="#475569">read-only DB connection · analyst login</text>

  <!-- 6. Investigation -->
  <rect x="40" y="420" width="280" height="200" rx="12" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="180" y="448" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">6 · Alerts &amp; investigation</text>
  <text x="180" y="480" text-anchor="middle" font-size="13" fill="#1e293b">Triage: ack / resolve / FP</text>
  <text x="180" y="504" text-anchor="middle" font-size="13" fill="#1e293b">Incident timeline from events</text>
  <text x="180" y="528" text-anchor="middle" font-size="13" fill="#1e293b">Evidence with SHA-256 hashes</text>
  <text x="180" y="552" text-anchor="middle" font-size="13" fill="#1e293b">Report export: Markdown / PDF</text>
  <text x="180" y="590" text-anchor="middle" font-size="11" fill="#475569">reports/INC-YYYYMMDD-NNN.md</text>

  <!-- arrows -->
  <line x1="320" y1="205" x2="406" y2="205" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="363" y="196" text-anchor="middle" font-size="11" fill="#334155">state</text>

  <line x1="690" y1="205" x2="776" y2="205" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="733" y="196" text-anchor="middle" font-size="11" fill="#334155">events</text>
  <text x="733" y="224" text-anchor="middle" font-size="10" fill="#64748b">queue</text>

  <line x1="920" y1="310" x2="920" y2="416" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="930" y="360" font-size="11" fill="#334155">events + alerts</text>

  <line x1="780" y1="520" x2="694" y2="520" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="737" y="510" text-anchor="middle" font-size="11" fill="#334155">SQL read</text>

  <line x1="410" y1="520" x2="324" y2="520" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="367" y="510" text-anchor="middle" font-size="11" fill="#334155">select alert</text>

  <path d="M180,620 L180,655 L920,655 L920,624" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="550" y="648" text-anchor="middle" font-size="11" fill="#334155">status changes + incidents written back (logged in alert_history)</text>

  <!-- optional ThingsBoard -->
  <rect x="410" y="330" width="280" height="56" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="550" y="353" text-anchor="middle" font-size="12" font-weight="600" fill="#475569">Optional: ThingsBoard Edge adapter</text>
  <text x="550" y="372" text-anchor="middle" font-size="11" fill="#64748b">MQTT publish of the same events (later phase)</text>
  <line x1="550" y1="310" x2="550" y2="326" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowMuted)"/>

  <text x="1060" y="690" text-anchor="end" font-size="10" fill="#94a3b8">Solid = Phase 1 data flow · Dashed = write-back / optional</text>
</svg>
